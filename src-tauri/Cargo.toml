[package]
name = "ebook-studio"
version = "0.1.0"
description = "A cross platform desktop application designed to provide convenience for e-book manage"
authors = ["Alfred Clark"]
license = "GPL-3.0-only"
repository = "https://github.com/AlfredClark/ebook-studio"
keywords = ["tauri", "desktop", "ebook"]
categories = ["gui"]
readme = "../README.md"
edition = "2024"

[lib]
name = "ebook_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dependencies]
base64 = "0.22"
chrono = "0.4"
regex = "1"
encoding_rs = "0.8"
log = "0.4.33"
rust-i18n = "4.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-log = "2.9.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2.4.4"
tauri-plugin-system-fonts = "2.0.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2"
chinese-number = "0.8.2"
